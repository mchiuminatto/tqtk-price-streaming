# The tqtk price pipeline stack, for local and single-host LAN bring-up.
#
# Platform components land first (tasks 4.1-4.4), the services on top of them as each is built.
# Run from the repository root, so relative paths and service build contexts resolve:
#
#     docker compose -f deploy/docker-compose.yml up -d
#
# See deploy/README.md for bring-up, verification and teardown.

name: tqtk

services:
  # The bus and the checkpoint store for every service - and, per the architecture note, the one
  # shared platform dependency whose outage stalls the whole pipeline. Durability configuration
  # (AOF `everysec` + RDB) lives in redis/redis.conf.
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      # Named, not bind-mounted: AOF and RDB have to outlive the container for a restart to
      # recover anything.
      - redis-data:/data
    ports:
      # Loopback-only. Redis runs without a password (LAN trust, architecture decision #9), so
      # the host publishes it for local tooling and tests, not to the LAN.
      - "127.0.0.1:6379:6379"
    healthcheck:
      # Services wait on `service_healthy`, so this has to mean "answering commands", not
      # "container started".
      test: ["CMD", "redis-cli", "PING"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # The system of record: PostgreSQL with the TimescaleDB extension, and no application tables.
  # `ticks` and `bars` are created by their owning services' migrations, not here - see
  # postgres/initdb/001-timescaledb.sql. Image pinned to the version the storage-contract tests
  # already build against (libs/tqtk-common/tests/test_storage_fixture.py).
  postgres:
    image: timescale/timescaledb:2.17.2-pg16
    # TimescaleDB's background worker otherwise reports usage to telemetry.timescale.com on a
    # timer. Nothing in the pipeline needs it, and a private price feed should not be making
    # outbound calls nobody asked for.
    command: ["postgres", "-c", "timescaledb.telemetry_level=off"]
    environment:
      POSTGRES_USER: tqtk
      POSTGRES_DB: tqtk
      # Overridable for a real deployment; the default is a dev-stack credential, which is
      # acceptable for the same reason Redis runs passwordless - LAN trust, and a loopback-only
      # published port (architecture decision #9).
      POSTGRES_PASSWORD: ${TQTK_POSTGRES_PASSWORD:-tqtk}
      # initdb only: C collation with UTF-8 encoding, so a text index sorts by byte order
      # regardless of the host's locale rather than picking one up from it.
      POSTGRES_INITDB_ARGS: "--locale=C.UTF-8 --encoding=UTF8"
    volumes:
      # Extension only. Scripts here run once, on an empty data directory.
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      # `-d`/`-U` explicitly: pg_isready would otherwise probe the `root` database as the
      # container's own user and report failure against a healthy server.
      test: ["CMD-SHELL", "pg_isready -U tqtk -d tqtk"]
      interval: 5s
      timeout: 3s
      retries: 10
      # initdb runs the extension install before the server accepts connections; a first start
      # is meaningfully slower than a restart.
      start_period: 30s
    restart: unless-stopped

volumes:
  redis-data:
  postgres-data:
