# The tqtk price pipeline stack, for local and single-host LAN bring-up.
#
# Platform components land first (tasks 4.1-4.4), the services on top of them as each is built.
# Run from the repository root, so relative paths and service build contexts resolve:
#
#     docker compose -f deploy/docker-compose.yml up -d
#
# See deploy/README.md for bring-up, verification and teardown.

name: tqtk

services:
  # The bus and the checkpoint store for every service - and, per the architecture note, the one
  # shared platform dependency whose outage stalls the whole pipeline. Durability configuration
  # (AOF `everysec` + RDB) lives in redis/redis.conf.
  redis:
    image: redis:7.4-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      # Named, not bind-mounted: AOF and RDB have to outlive the container for a restart to
      # recover anything.
      - redis-data:/data
    ports:
      # Loopback-only. Redis runs without a password (LAN trust, architecture decision #9), so
      # the host publishes it for local tooling and tests, not to the LAN.
      - "127.0.0.1:6379:6379"
    healthcheck:
      # Services wait on `service_healthy`, so this must mean "answering commands", not "container
      # started". `redis-cli` exits 0 even on an error reply, so the `grep` matches the reply text
      # rather than trusting the exit status - which is why this is not a bare `redis-cli PING`.
      # `PING` is a faithful verdict here: Redis refuses it while loading (`-LOADING`) and once
      # `stop-writes-on-bgsave-error` has latched (`-MISCONF`). An earlier `SET` probe forced a
      # BGSAVE every 15 minutes on an idle stack.
      #
      # Full rationale, the timing math, and the `maxmemory` caveat that would change this call:
      # deploy/README.md, "Why the healthcheck reads rather than writes".
      test: ["CMD-SHELL", "redis-cli PING | grep -q PONG"]
      interval: 15s
      timeout: 3s
      retries: 5
      # A populated volume replays its AOF before Redis answers, so a cold start is meaningfully
      # slower than a restart - matches the Postgres value; see redis/redis.conf for the
      # recovery-time assumption behind it.
      start_period: 30s
    restart: unless-stopped

  # The system of record: PostgreSQL with the TimescaleDB extension, and no application tables.
  # `ticks` and `bars` are created by their owning services' migrations, not here - see
  # postgres/initdb/001-timescaledb.sql. Image pinned to the version the storage-contract tests
  # already build against (libs/tqtk-common/tests/test_storage_fixture.py).
  postgres:
    image: timescale/timescaledb:2.17.2-pg16@sha256:4e459e217f00cbb09920c34d245501e63427e6767a495de57ce76823ff280f12
    # TimescaleDB's background worker otherwise reports usage to telemetry.timescale.com on a
    # timer. Nothing in the pipeline needs it, and a private price feed should not be making
    # outbound calls nobody asked for.
    command: ["postgres", "-c", "timescaledb.telemetry_level=off"]
    environment:
      POSTGRES_USER: tqtk
      POSTGRES_DB: tqtk
      # Read from a file, not from a variable with a default. A default here would be a working
      # credential committed to the repository - and `POSTGRES_PASSWORD` in the environment is
      # readable for the life of the container with `docker inspect`, by anyone who can talk to
      # the Docker socket. The `_FILE` suffix is the official entrypoint's own convention: it
      # reads the file and never puts the value in the environment. Generate it with
      # deploy/bootstrap-secrets.sh; the stack refuses to start if it is missing, which is the
      # intended behaviour - no silent fallback to a password everyone knows.
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      # initdb only: C collation with UTF-8 encoding, so a text index sorts by byte order
      # regardless of the host's locale rather than picking one up from it.
      POSTGRES_INITDB_ARGS: "--locale=C.UTF-8 --encoding=UTF8"
    secrets:
      - postgres_password
    volumes:
      # Extension only. Scripts here run once, on an empty data directory.
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      # `-d`/`-U` explicitly: pg_isready would otherwise probe the `root` database as the
      # container's own user and report failure against a healthy server. `-h` explicitly too, and
      # this is the load-bearing flag: without it pg_isready probes the Unix socket, which the
      # temporary server initdb runs also serves, so the probe passes for the whole bootstrap while
      # TCP - the only path a dependent service uses - is still refused. That server is started
      # with `listen_addresses=''`, so asking over TCP is what distinguishes it from the real one.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U tqtk -d tqtk"]
      interval: 5s
      timeout: 3s
      retries: 10
      # initdb runs the extension install before the server accepts connections; a first start
      # is meaningfully slower than a restart.
      start_period: 30s
    restart: unless-stopped

  # Metrics collection. Scrapes every service's /metrics on a pull schedule - see
  # prometheus/prometheus.yml for the targets and why each service gets its own job. Until a
  # service is built and in this file, its target reports down, which is the honest answer.
  prometheus:
    image: prom/prometheus:v3.1.0@sha256:6559acbd5d770b15bb3c954629ce190ac3cbbdb2b7f1c30f0385c4e05104e218
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Comfortably longer than any dashboard window, and small at this cardinality.
      - --storage.tsdb.retention.time=15d
      # Lets `POST /-/reload` pick up a scrape-config edit; adding a service should not mean
      # restarting the thing watching the ones already running.
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # One-shot job: applies the calibration seed script (symbology, instrument metadata, fitted
  # distributions - the only writer of that keyspace) with redis-cli, then exits. It re-runs on
  # every `up`, so a Redis that lost its data comes back calibrated. The stock Redis image, for its
  # redis-cli: the script is data, mounted in, not baked into any image.
  calibration-seeder:
    image: redis:7.4-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./calibration/calibration.redis:/seed/calibration.redis:ro
      - ./calibration/seed.sh:/seed/seed.sh:ro
    # Dry-runs the script on scratch DB 15, then applies it to DB 0 only if that run was clean -
    # see seed.sh for why MULTI/EXEC alone is not enough. Kept in its own file, not inline here,
    # so its integration test runs exactly this script.
    entrypoint: ["sh", "/seed/seed.sh"]
    # Run to completion, never restart: the adapter gates on this exiting 0.
    restart: "no"

  # Configurable-rate synthetic tick generator: publishes calibrated ticks to
  # ticks.raw.synthetic.{symbol} for every symbol in the calibration store (services/
  # feed-adapter-synthetic). Prometheus already scrapes this job name (prometheus/prometheus.yml),
  # so it reports "up" once this is running.
  feed-adapter-synthetic:
    build:
      # Repo root, not this directory - see the Dockerfile's own header: it resolves
      # `tqtk-common` through the workspace root pyproject.toml against the shared uv.lock.
      context: ..
      dockerfile: services/feed-adapter-synthetic/Dockerfile
    depends_on:
      redis:
        condition: service_healthy
      # The adapter refuses to start against an unseeded store, so it waits for the seeder to
      # finish successfully rather than crash-looping until it does.
      calibration-seeder:
        condition: service_completed_successfully
    environment:
      # Compose's own DNS name for the redis service, not the config default (localhost), which
      # only resolves inside redis's own container.
      TQTK_REDIS_URL: redis://redis:6379/0
    healthcheck:
      # `/health` ("is this process alive"), not `/ready` ("has it reached Redis") - restart is
      # the right response to the first, not to a Redis outage this same stack's `depends_on`
      # already staggers past. See tqtk_common.server's module docstring for the distinction.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # Dashboards and alerting over the Prometheus data. Datasource and (from task 12.2) dashboards
  # are provisioned from files, so a clean bring-up needs no clicking to reproduce.
  grafana:
    image: grafana/grafana:11.4.0@sha256:d8ea37798ccc41061a62ab080f2676dda6bf7815558499f901bdb0f533a456fb
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: admin
      # Same reasoning as the Postgres password above. `__FILE` (two underscores) is Grafana's
      # own convention for this, handled by its entrypoint before the config is parsed.
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      # No outbound calls nobody asked for, matching the TimescaleDB telemetry decision above.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
    secrets:
      - grafana_admin_password
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      # Dashboards edited in the UI, alert state, and the user database live here.
      - grafana-data:/var/lib/grafana
    ports:
      # Loopback, like every other component, and not overridable from here. Grafana is the one
      # component a person opens rather than a service connects to, so it is the one whose port may
      # need to answer from another LAN host. Widening it is a deliberate act rather than a
      # variable on this file: it goes through docker-compose.lan.yml. The admin password is a
      # generated secret either way, so widening no longer risks publishing a known credential -
      # the overlay exists so that leaving loopback is visible in the command. See deploy/README.md.
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    restart: unless-stopped

# Credentials are files on the host, generated per machine by deploy/bootstrap-secrets.sh and
# mounted at /run/secrets/<name>. Nothing here carries a default: a missing secret stops the stack
# instead of starting it with a password that is in the repository for anyone to read.
secrets:
  postgres_password:
    file: ./secrets/postgres_password
  grafana_admin_password:
    file: ./secrets/grafana_admin_password

volumes:
  redis-data:
  postgres-data:
  prometheus-data:
  grafana-data:
