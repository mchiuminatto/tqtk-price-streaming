# Redis configuration for the tqtk price pipeline.
#
# Redis is the bus AND the checkpoint store for every service, so a restart that lost the last
# few seconds of writes would lose both unpersisted ticks/bars and the aggregation checkpoints
# that make crash recovery exact. The `platform-resilience` capability therefore requires both
# persistence mechanisms on at once (design.md, "Redis durability: AOF (`everysec`) *and* RDB,
# not either alone"): AOF bounds loss to ~1s, RDB gives the fast full-restore path.
#
# A config file rather than `command:` flags in the Compose file: the three `save` points are
# separate directives that accumulate, which a single command line cannot express, and the
# durability decision is worth stating where it takes effect.
#
# Verify after startup:
#
#     docker compose -f deploy/docker-compose.yml exec redis redis-cli CONFIG GET appendonly
#     docker compose -f deploy/docker-compose.yml exec redis redis-cli CONFIG GET save

# AOF and RDB both write here; the Compose file mounts it as a named volume so both survive
# `docker compose down` (a restart of the process is exactly the case they exist for).
dir /data

# --- AOF ----------------------------------------------------------------------------------------
# `everysec` rather than `always`: an fsync per write would put disk latency on the tick hot path
# for a durability guarantee finer than the "seconds to a few hours" resiliency target needs.
appendonly yes
appendfsync everysec

# --- RDB ----------------------------------------------------------------------------------------
# Redis' own defaults, stated explicitly because "RDB is on" is a contract here rather than an
# inherited default: snapshot after 1 change in 15 min, 100 in 5 min, or 10,000 in 1 min. At the
# pipeline's write rate the last of the three is the one that fires. An idle stack snapshots only
# if something writes to it - the Compose healthcheck deliberately does not (it probes with PING),
# so "no traffic" really does mean "no snapshots" here.
save 900 1
save 300 100
save 60 10000

# A failed background save means the RDB half of the durability pair is silently not happening;
# refusing writes surfaces that instead of letting the stack run on AOF alone unnoticed.
stop-writes-on-bgsave-error yes

# --- Network ------------------------------------------------------------------------------------
# Reachable from the other containers on the Compose network. No password: LAN trust only at this
# stage (architecture decision #9), which is also why the published port below is loopback-only.
bind 0.0.0.0
protected-mode no

# --- Memory -------------------------------------------------------------------------------------
# `maxmemory` is deliberately unset. An eviction policy would drop bus entries and checkpoints
# under pressure, silently, which is the one failure this configuration exists to prevent; stream
# size is bounded by the bus-retention janitor's consumer-position-driven trim and hard cap
# instead. Sizing guidance for the volume to provision is in the architecture note.
