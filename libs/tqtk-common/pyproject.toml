[project]
name = "tqtk-common"
version = "0.1.0"
description = "Shared contract types, stream naming, runtime server, config, and logging for the tqtk price pipeline."
requires-python = ">=3.12"
dependencies = [
    "prometheus-client>=0.21",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tqtk_common"]
