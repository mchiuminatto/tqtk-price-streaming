[project]
name = "tqtk-price-streaming"
version = "0.1.0"
description = "Real-time price pipeline: tick ingestion, OHLCV bar aggregation, persistence, and LAN streaming."
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["libs/*", "services/*"]

# Workspace-internal dependencies resolve to the local source tree, not PyPI.
# Members inherit these sources from the workspace root.
[tool.uv.sources]
tqtk-common = { workspace = true }

[dependency-groups]
dev = [
    "jsonschema>=4.23",
    "psycopg[binary]>=3.2",
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

# `tqtk-common` is installed into each member's environment, so ruff would otherwise sort it in
# with third-party imports. It is workspace source, and every service imports it.
[tool.ruff.lint.isort]
known-first-party = ["tqtk_common"]

[tool.pytest.ini_options]
testpaths = ["contracts", "libs", "services", "tools"]
# Tests needing a real database, which start a container and skip without one. Deselect with
# `-m "not integration"`; CI runs them once task 4.2 brings the Compose stack.
markers = ["integration: requires a running PostgreSQL/TimescaleDB"]
# `tools` is not an installed package, so the repo root has to be importable
# for `from tools.ci.affected_members import ...` to resolve.
pythonpath = ["."]
