[project]
name = "aggregation-svc"
version = "0.1.0"
description = "Per-(provider, symbol, timeframe) actor model building live OHLCV bars across 8 timeframes."
requires-python = ">=3.12"
dependencies = [
    "tqtk-common",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aggregation_svc"]
