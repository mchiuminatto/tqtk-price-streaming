[project]
name = "bar-persistence-svc"
version = "0.1.0"
description = "Sole writer of the bars table; idempotently upserts closed bars from bars.*.* to TimescaleDB."
requires-python = ">=3.12"
dependencies = [
    "tqtk-common",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bar_persistence_svc"]
