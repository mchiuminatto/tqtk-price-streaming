[project]
name = "feed-adapter-synthetic"
version = "0.1.0"
description = "Configurable-rate synthetic tick generator publishing raw ticks to ticks.raw.synthetic.{symbol}."
requires-python = ">=3.12"
dependencies = [
    "tqtk-common",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/feed_adapter_synthetic"]
