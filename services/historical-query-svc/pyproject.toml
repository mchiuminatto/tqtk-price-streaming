[project]
name = "historical-query-svc"
version = "0.1.0"
description = "Stateless read-only REST API over the ticks and bars tables."
requires-python = ">=3.12"
dependencies = [
    "tqtk-common",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/historical_query_svc"]
