[project]
name = "streaming-gateway-svc"
version = "0.1.0"
description = "WebSocket relay of live ticks and bars to LAN consumers, plus the bootstrap snapshot endpoint."
requires-python = ">=3.12"
dependencies = [
    "tqtk-common",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/streaming_gateway_svc"]
