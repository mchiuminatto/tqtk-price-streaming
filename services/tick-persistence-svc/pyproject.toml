[project]
name = "tick-persistence-svc"
version = "0.1.0"
description = "Sole writer of the ticks table; batch-persists raw ticks from ticks.raw.* to TimescaleDB."
requires-python = ">=3.12"
dependencies = [
    "tqtk-common",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tick_persistence_svc"]
